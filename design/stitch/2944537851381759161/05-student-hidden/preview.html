  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary-light-tint"><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl shadow-[0_4px_20px_rgba(125,117,106,0.04)] pt-safe"><div class="h-16 px-screen-edge-padding flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="返回" class="w-11 h-11 -ml-2 rounded-full flex items-center justify-center text-on-surface active:bg-surface-variant transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span></button><img alt="淇澳背单词 Logo" class="h-7 w-auto object-contain" src="../assets/15752763ce4bc7c6.png"/><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight leading-none truncate max-w-[170px]">Learning Session</h1></div><div class="flex items-center"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe px-screen-edge-padding bg-surface"><div class="flex flex-col w-full pb-6 select-none">
<!-- 顶部自测状态栏 -->
<div class="flex items-center justify-between gap-space-sm mb-space-sm pt-1">
<button aria-label="放弃自测并退出" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant active:scale-95 transition-transform" onclick="window.history.back()" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
<div class="flex-1 flex flex-col items-center">
<span class="font-label-sm text-label-sm text-text-secondary tracking-wide mb-1.5">
        第 18 / 40 词 <span class="text-text-muted">(Round 1)</span>
</span>
<div class="w-full max-w-[200px] h-1.5 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 45%;"></div>
</div>
</div>
<!-- 实时小计数器 -->
<div class="flex items-center gap-1.5 bg-surface-container-low px-2.5 py-1.5 rounded-full shadow-sm">
<span class="font-label-sm text-label-sm text-text-secondary flex items-center gap-0.5">
<span class="w-1.5 h-1.5 rounded-full bg-text-muted"></span>17
      </span>
<span class="text-text-muted text-[10px]">•</span>
<span class="font-label-sm text-label-sm text-primary flex items-center gap-0.5">
<span class="w-1.5 h-1.5 rounded-full bg-primary"></span>14
      </span>
<span class="text-text-muted text-[10px]">•</span>
<span class="font-label-sm text-label-sm text-tertiary flex items-center gap-0.5">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span>3
      </span>
</div>
</div>
<!-- 核心学习卡片 (答案隐藏态) -->
<div class="relative w-full bg-surface-card rounded-[26px] p-6 shadow-[0_10px_30px_rgba(84,113,90,0.07)] flex flex-col justify-between min-h-[410px] transition-all duration-300" id="learningCard">
<!-- 顶部批注标签组 -->
<div class="flex items-center justify-between w-full mb-3">
<div class="flex items-center gap-1.5">
<span class="bg-tag-adj-bg text-tag-adj-text font-label-sm text-label-sm px-2.5 py-0.5 rounded-full font-medium">重点核心词汇</span>
<span class="bg-surface-container text-text-secondary font-label-sm text-label-sm px-2.5 py-0.5 rounded-full font-medium">高二必修</span>
</div>
<button aria-label="收藏单词" class="w-8 h-8 rounded-full flex items-center justify-center text-text-muted hover:text-secondary active:scale-90 transition-transform" id="bookmarkBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="bookmarkIcon">bookmark_border</span>
</button>
</div>
<!-- 单词与发音主体 -->
<div class="flex flex-col items-center text-center mt-2">
<h2 class="font-display-word-mobile text-display-word-mobile text-on-surface tracking-tight mb-2 selection:bg-primary-light-tint">
        subordinate
      </h2>
<!-- 音标与发音按钮 -->
<div class="flex items-center justify-center gap-2 mb-3">
<span class="font-phonetic text-phonetic text-text-secondary">
          [sə'bɔːdɪnət]
        </span>
<button aria-label="朗读发音" class="w-8 h-8 rounded-full bg-accent-warm-sand flex items-center justify-center text-on-surface active:scale-95 transition-all" id="audioBtn" type="button">
<span class="material-symbols-outlined text-[18px] text-primary" id="audioIcon">volume_up</span>
</button>
</div>
<!-- 词性胶囊徽章 -->
<div class="flex items-center justify-center gap-1.5">
<span class="bg-tag-adj-bg text-tag-adj-text font-label-sm text-label-sm px-2.5 py-0.5 rounded-full">adj.</span>
<span class="bg-tag-noun-bg text-tag-noun-text font-label-sm text-label-sm px-2.5 py-0.5 rounded-full">n.</span>
<span class="bg-tag-verb-bg text-tag-verb-text font-label-sm text-label-sm px-2.5 py-0.5 rounded-full">vt.</span>
</div>
</div>
<!-- 中间大面积纸张留白与思考引导 -->
<div class="flex-1 flex flex-col items-center justify-center py-8 px-4 text-center">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center mb-3 text-text-muted">
<span class="material-symbols-outlined text-[24px]">psychology</span>
</div>
<p class="font-body-sm text-body-sm text-text-secondary max-w-[220px] leading-relaxed">
        在心中默背释义与拼写<br/>点击下方按钮检验记忆
      </p>
</div>
<!-- 底部辅助提醒装饰 -->
<div class="pt-3 flex items-center justify-center gap-2 text-text-muted">
<span class="w-1.5 h-1.5 rounded-full bg-outline-variant"></span>
<span class="font-label-sm text-label-sm tracking-wider">RECALL PHASE</span>
<span class="w-1.5 h-1.5 rounded-full bg-outline-variant"></span>
</div>
</div>
<!-- 底部双决策操作区 -->
<div class="mt-space-xl flex flex-col gap-2.5">
<div class="grid grid-cols-2 gap-space-sm w-full">
<!-- 不会 (直接记错) -->
<button class="h-14 rounded-full bg-danger-soft active:bg-error-container text-tertiary flex items-center justify-center gap-1.5 shadow-sm active:scale-[0.98] transition-all" id="btnWrong" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
<span class="font-label-lg text-label-lg font-semibold">不会</span>
<span class="font-label-sm text-label-sm opacity-80">(记错)</span>
</button>
<!-- 会 (核对答案) -->
<button class="h-14 rounded-full bg-primary active:bg-primary-deep text-on-primary flex items-center justify-center gap-1.5 shadow-md active:scale-[0.98] transition-all" id="btnCheck" type="button">
<span class="material-symbols-outlined text-[20px]">check</span>
<span class="font-label-lg text-label-lg font-semibold">会</span>
<span class="font-label-sm text-label-sm opacity-80">(核对)</span>
</button>
</div>
<!-- PRD规范说明浅字 -->
<p class="font-label-sm text-label-sm text-center text-text-muted mt-0.5">
      点击「会」仅展开答案以供核对，确认正确后才会记入掌握
    </p>
</div>
</div>
<script>
  (function() {
    const audioBtn = document.getElementById('audioBtn');
    const audioIcon = document.getElementById('audioIcon');
    const bookmarkBtn = document.getElementById('bookmarkBtn');
    const bookmarkIcon = document.getElementById('bookmarkIcon');
    const btnCheck = document.getElementById('btnCheck');
    const btnWrong = document.getElementById('btnWrong');

    // 模拟发音交互动效
    if (audioBtn && audioIcon) {
      audioBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        audioIcon.textContent = 'volume_up';
        audioBtn.classList.add('bg-secondary-fixed');
        setTimeout(() => {
          audioBtn.classList.remove('bg-secondary-fixed');
        }, 400);
      });
    }

    // 收藏切换
    if (bookmarkBtn && bookmarkIcon) {
      bookmarkBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const isFilled = bookmarkIcon.textContent === 'bookmark';
        bookmarkIcon.textContent = isFilled ? 'bookmark_border' : 'bookmark';
        bookmarkBtn.classList.toggle('text-secondary', !isFilled);
        bookmarkBtn.classList.toggle('text-text-muted', isFilled);
      });
    }

    // 点击「会 (核对答案)」按键逻辑动效提示
    if (btnCheck) {
      btnCheck.addEventListener('click', function() {
        btnCheck.classList.add('opacity-90');
        setTimeout(() => {
          btnCheck.classList.remove('opacity-90');
        }, 200);
      });
    }

    // 点击「不会 (记错)」
    if (btnWrong) {
      btnWrong.addEventListener('click', function() {
        btnWrong.classList.add('opacity-80');
        setTimeout(() => {
          btnWrong.classList.remove('opacity-80');
        }, 200);
      });
    }
  })();
</script></main></body></html>
